# Publishes the project site (packages/site) to GitHub Pages from main: what
# Xray is, its UI, how to install it, its CLI reference and its documentation.
# GitHub Pages hosts the project site only, never the app (PRD §4; ADR 0003).
# docs/processes/project-site.md says how, and what has to be set up first.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# None by default; each job asks for only what it needs.
permissions: {}

# One deployment at a time; a newer push waits rather than cancelling one
# half-way through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          # No cache another workflow could have written into what is deployed.
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile

      # The page, from the CLI's help, the install instructions and docs/, with
      # its stylesheet and the screenshots of the UI committed beside it.
      - run: pnpm build:site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: packages/site/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
