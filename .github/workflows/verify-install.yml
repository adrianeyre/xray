# Runs the install instructions the project site and the README give, as they
# are written, against @adrianeyre/xray as published on npm, on every OS Xray
# supports: `pnpm add -g` into a PNPM_HOME of its own, then `xray doctor`, then
# checks `xray --help` is the site's CLI reference. The Release workflow calls
# it once it has published a version; run it by hand to check one already on
# npm. docs/processes/project-site.md says more.
name: Verify install

on:
  workflow_call:
    inputs:
      version:
        description: The version to install; the one in packages/xray/package.json if empty.
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      version:
        description: The version to install; the one in packages/xray/package.json if empty.
        type: string
        default: ""

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  verify-install:
    name: install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          package-manager-cache: false
      # What the instructions say a user needs: xray doctor checks it.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - run: pnpm install --frozen-lockfile

      # The version is pinned, as npm's `latest` tag can take a moment to reach
      # every mirror after a release; the commands are otherwise as written.
      # bash runs with pipefail, so instructions that do not work fail the step.
      - env:
          VERSION: ${{ inputs.version }}
        run: |
          version="${VERSION:-$(node -p "require('./packages/xray/package.json').version")}"
          pnpm --silent --filter @xray/site verify-install --package "@adrianeyre/xray@$version" | tee -a "$GITHUB_STEP_SUMMARY"
